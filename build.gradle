plugins {
    id "org.jetbrains.kotlin.jvm" version "1.9.24" apply false
    id "org.jetbrains.kotlin.plugin.serialization" version "1.9.24" apply false
}
allprojects {
    group = "com.github.itzrandom23.pulselink"

    repositories {
        mavenLocal()
        maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }
        mavenCentral()
        maven { url "https://jitpack.io" }
    }

    // Bundle the fixed LavaLyrics (Vexify4103/LavaLyrics) instead of lavalyrics 1.0.0,
    // so one failing lyrics source no longer fails the whole lookup
    configurations.all {
        exclude group: "com.github.topi314.lavalyrics", module: "lavalyrics"
    }
}

subprojects {
    apply plugin: "java"
    apply plugin: "maven-publish"

    def versionStr = "1.7.6-hambot"
    def isSnapshot = false
    version versionStr
    println "Version: " + versionStr

    compileJava.options.encoding = "UTF-8"
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    tasks.withType(Javadoc).configureEach {
        enabled = false
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    if (project.name != "plugin") {
        tasks.matching { it.name.startsWith("publish") || it.name.startsWith("generatePomFileFor") }.configureEach {
            enabled = false
        }
    }
}
