pluginManagement {
    repositories {
        // Prefer the cached mirror to reduce Maven Central requests on CI.
        maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }
        gradlePluginPortal()
    }
}

rootProject.name = "Sonara"
enableFeaturePreview("TYPESAFE_PROJECT_ACCESSORS")

include(":main")
include(":plugin")
include(":protocol")
