plugins:
  sonara:
    providers:
      - dzisrc:%ISRC%
      - dzsearch:%QUERY%
      - jssearch:%QUERY%
      - gnsearch:%QUERY%
      - admsearch:%QUERY%
      - scsearch:%QUERY%
    sources:
      spotify: true
      amazonmusic: false
      applemusic: false
      deezer: false
      yandexmusic: false
      vkmusic: false
      tidal: false
      qobuz: false
      ytdlp: false
      jiosaavn: false
      audiomack: false
      gaana: false
      pandora: false
      flowerytts: false
      youtube: false
    lyrics-sources:
      deezer: false
      youtube: false
      yandexmusic: false
      vkmusic: false
      # Free plain and synchronized lyrics from LRCLIB.
      lrcLib: true
      # Plain lyrics from Genius. No account needed.
      genius: false
      # Spotify lyrics through your Sonara-API server (spotify.resolvePlaylistUrl). The server needs SPOTIFY_SP_DC.
      spotify: false
    spotify:
      # Spotify app credentials from https://developer.spotify.com/dashboard.
      # Used for tracks, albums, artists and search (Spotify Web API), and sent to the Sonara-API resolver as headers to get ISRCs.
      clientId: "your client id"
      clientSecret: "your client secret"
      # Optional. Your Sonara-API resolver (https://github.com/SonaraHQ/Sonara-API).
      # Loads all playlists, including Spotify-made ones (Daily Mix, Top 50, radios) that the Web API blocks,
      # and sprec: recommendations. Without it, user playlists still load through the Web API.
      # Use the base URL; Sonara adds /playlist, /recommendations and /lyrics itself.
      # resolvePlaylistUrl: "http://your-sonara-api-host:1500"
      # Optional. Anonymous Spotify token endpoint, for example Sonara-API's /spotifytoken.
      # Needed for album and artist mixes (sprec:mix:album:/sprec:mix:artist:), and used for the Web API when no clientId is set.
      # anonymousTokenUrl: "http://your-sonara-api-host:1500/spotifytoken"
      # Behind a reverse proxy with a login, add it to both URLs (https://user:password@host); it is sent as a header, not logged.
      countryCode: "US"
      playlistLoadLimit: 6
      albumLoadLimit: 6
      resolveArtistsInSearch: true
      localFiles: false
    amazonmusic:
      # Required for Amazon Music: base URL of a compatible Amazon Music API server. There is no default.
      # apiUrl: "https://your-amazon-music-api"
      # Optional. 0-10
      searchLimit: 10
    applemusic:
      countryCode: "US"
      # Optional. Apple Music playback can work without this token.
      mediaAPIToken: "your apple music api token"
    deezer:
      masterDecryptionKey: "your master decryption key"
      arl: "your deezer arl"
      formats: [ "FLAC", "MP3_320", "MP3_256", "MP3_128", "MP3_64", "AAC_64" ]
    yandexmusic:
      accessToken: "your access token"
      playlistLoadLimit: 1
      albumLoadLimit: 1
      artistLoadLimit: 1
    vkmusic:
      userToken: "your user token"
      playlistLoadLimit: 1
      artistLoadLimit: 1
      recommendationsLoadLimit: 10
    tidal:
      countryCode: "US"
      searchLimit: 6
      # Optional. Override only if you want to use your own Tidal token.
      # token: "your tidal token"
      # Optional: direct streaming via hifi-api (third-party)
      hifiApis:
        - "https://hifi-two.spotisaver.net"
      # Optional: order of qualities to try for direct streaming
      hifiQualities: [ "HI_RES_LOSSLESS", "LOSSLESS", "HIGH", "LOW" ]
    ytdlp:
      path: "yt-dlp"
      searchLimit: 10
    audiomack:
      searchLimit: 10
      artistTrackLimit: 25
      # Optional. The built-in Audiomack web credentials are used when omitted.
      # consumerKey: "your consumer key"
      # consumerSecret: "your consumer secret"
    gaana:
      # Optional. Defaults to https://gaanapi-wine.vercel.app/
      apiUrl: "https://gaanapi-wine.vercel.app/"
    soundcloud:
      searchLimit: 10
      userTrackLimit: 25
      # Optional. Defaults to "ffmpeg" from PATH; set an absolute path if needed.
      ffmpegPath: "ffmpeg"
    pandora:
      csrfToken: ""
      authToken: ""
      # Optional. Override only if you want to use your own token provider.
      # remoteTokenUrl: "https://get.1lucas1apk.fun/pandora/gettoken"
    jiosaavn:
      # Built-in defaults are used if you do not override them.
      # decryption:
      #   algorithm: DES
      #   secretKey: "38346591"
      #   transformation: DES/ECB/PKCS5Padding
server:
  port: 2333
  address: 0.0.0.0

lavalink:
  server:
    password: "youshallnotpass"
